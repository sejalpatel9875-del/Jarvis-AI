version: '3.8'

services:
  jarvis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis_ai_os
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JARVIS_API_KEY=${JARVIS_API_KEY:-}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
