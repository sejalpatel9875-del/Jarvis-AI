<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JARVIS AI Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="title-group">
      <span class="orb-icon">●</span>
      <h1>JARVIS AI OS</h1>
    </div>
    <span class="status-tag">v5.5.0</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="chat-tab">Chat</button>
    <button class="tab-btn" data-tab="summary-tab">Summary</button>
    <button class="tab-btn" data-tab="notes-tab">Notes</button>
    <button class="tab-btn" data-tab="tools-tab">Tools</button>
  </div>

  <!-- Quick Chat Tab -->
  <div id="chat-tab" class="tab-content active">
    <div id="chat-box" class="chat-box">
      <div class="msg jarvis">Namaste! How can I assist you with this webpage today?</div>
    </div>
    <div class="input-row">
      <input type="text" id="chat-input" placeholder="Ask JARVIS..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Page Summary Tab -->
  <div id="summary-tab" class="tab-content">
    <button id="summarize-page-btn" class="action-btn primary">📝 Summarize Active Page</button>
    <div id="summary-output" class="output-box">Click above to summarize the current webpage...</div>
  </div>

  <!-- Notes Tab -->
  <div id="notes-tab" class="tab-content">
    <textarea id="note-input" placeholder="Write a note to save to JARVIS memory..."></textarea>
    <button id="save-note-btn" class="action-btn success">💾 Save Note to Memory</button>
    <div id="note-status" class="status-msg"></div>
  </div>

  <!-- Tools Tab -->
  <div id="tools-tab" class="tab-content">
    <button id="reading-mode-btn" class="action-btn secondary">📖 Toggle Reading Mode</button>
    <button id="screenshot-btn" class="action-btn secondary">📸 Capture Visible Tab</button>
    <button id="close-duplicates-btn" class="action-btn secondary">📑 Close Duplicate Tabs</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
