[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-os"
version = "1.5.2"
description = "Autonomous Multi-Agent AI Operating System Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["ai", "assistant", "multi-agent", "autonomous-agents", "llm-router"]
authors = [
  {name = "Jarvis AI Team", email = "jarvis@example.com"}
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
